<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }} — {{ site.description }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  {% if site.favicon %}
    <link rel="icon" href="{{ site.favicon | relative_url }}">
  {% endif %}
</head>
<body>

  {% include header.html %}

  <div class="site-layout">
    <main class="main-content" id="main-content">
      {% if page.show_header != false %}
        <header class="page-header">
          <h1 class="page-title">{{ page.title | default: site.title }}</h1>
          {% if page.subtitle %}
            <p class="page-meta">{{ page.subtitle }}</p>
          {% endif %}
        </header>
      {% endif %}

      <article class="content-body">
        {{ content }}
      </article>

      {% include footer.html %}
    </main>

    {% include toc.html %}
  </div>

</body>
</html>
