<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }} - {{ site.tagline }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  
  <!-- Favicon -->
  {% if site.favicon %}
    <link rel="icon" type="image/png" href="{{ site.baseurl }}/{{ site.favicon }}">
  {% endif %}

  <!-- Stylesheets -->
  <link rel="stylesheet" href="{{ site.baseurl }}/assets/css/style.css">
</head>
<body>

  <!-- Fixed Top-Left Logo -->
  {% include header.html %}

  <div class="site-layout">
    
    <!-- Left Sidebar Column (Metadata / Static Context) -->
    <aside class="layout-sidebar">
      <div class="sidebar-metadata">
        <p><strong>{{ site.title }}</strong></p>
        <p>{{ site.tagline }}</p>
        <p style="margin-top: 0.5rem; font-size: 0.75rem; color: var(--text-dim);">
          Vol. 1, No. 1 &bull; July 2026<br>
          Montana Review &amp; Dispatches
        </p>
      </div>
    </aside>

    <!-- Main Content Area (Right ~3/4 of Page) -->
    <main class="layout-main">
      
      <!-- Table of Contents Column Grid (Rotated Links) -->
      {% include toc.html %}

      <!-- Dynamic Hypermedia Content Panel -->
      <section id="main-content-display" class="content-area" aria-live="polite">
        {{ content }}
      </section>

    </main>
  </div>

  {% include footer.html %}

  <!-- Zero dependency Hypermedia Script -->
  <script src="{{ site.baseurl }}/assets/js/main.js"></script>
</body>
</html>
