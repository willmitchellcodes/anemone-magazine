<!-- Table of Contents Column Grid with Off-Center Rotations -->
<section class="toc-section" aria-label="Table of Contents">
  <div class="toc-header">Table of Contents &bull; Issue Directory</div>
  <div class="toc-grid">
    {% for item in site.toc_items %}
      <div 
        class="toc-card rotate-{{ item.rotation }}" 
        data-slug="{{ item.slug }}"
        data-url="{{ site.baseurl }}/{{ item.url }}"
        data-type="{{ item.type }}"
        data-title="{{ item.title }}"
        role="button"
        tabindex="0"
      >
        <div>
          <div class="toc-number">SECTION 0{{ forloop.index }}</div>
          <div class="toc-title">{{ item.title }}</div>
        </div>
        <div class="toc-desc">
          {% if item.type == 'blog_index' %}
            Browse dispatches parsed from folder of .docx files.
          {% else %}
            View article &bull; Direct hypermedia reader.
          {% endif %}
        </div>
      </div>
    {% endfor %}
  </div>
</section>
