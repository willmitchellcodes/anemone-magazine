# Anemone Magazine - Site Configuration
title: "Anemone"
description: "Analog perspective."
url: "" # host url
baseurl: "" # subpath if any

# Author / Editorial Info
editor_email: "staff@anemonereview.com"
current_issue: "Vol. 1, No. 1 (July 2026)"
next_submission_deadline: "Vol. 1, No. 2 due October 1, 2026"

# Design & Layout Settings (Parameterized)
font_family: "'Atkinson Hyperlegible', sans-serif"
bg_color: "#f7f7f5"
text_color: "#121212"
accent_color: "#000000"

# TOC Links & Parameters (Fixed permalinks ending in .html)
toc_links:
  - title: "Main / Home"
    url: "/"
  - title: "Letter from Editor"
    url: "/letter-from-editor.html"
  - title: "Submission Guidelines"
    url: "/submission-guidelines.html"
  - title: "Advertise"
    url: "/advertise.html"
  - title: "Docx Blog Archive"
    url: "/blogs.html"

# Jekyll Build Settings
markdown: kramdown
permalink: /:basename.html
include: ["pages"]
exclude:
  - README.md
  - old site/
  - _site/
  - Gemfile.lock
